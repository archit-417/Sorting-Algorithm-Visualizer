<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SortIT</title>

    <!-- Favicon links -->
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="manifest" href="images/site.webmanifest">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-sort-amount-up"></i>
                <h1>SortIT: Sorting Visualizer</h1>
            </div>
            
            <div class="controls">
                <div class="control-group">
                    <label for="a_size">Array Size</label>
                    <div class="slider-container">
                        <i class="fas fa-text-height fa-sm"></i>
                        <input id="a_size" type="range" min="20" max="120" step="1" value="80" class="slider">
                        <span id="size-value">80</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label for="a_speed">Sorting Speed</label>
                    <div class="slider-container">
                        <i class="fas fa-tachometer-alt fa-sm"></i>
                        <input id="a_speed" type="range" min="1" max="5" step="1" value="4" class="slider">
                        <span id="speed-value">4</span>
                    </div>
                </div>
                
                <button id="a_generate" class="btn primary">
                    <i class="fas fa-random"></i> New Array
                </button>
            </div>
        </header>

        <main>
            <div class="algorithm-panel">
                <h2>Select Algorithm</h2>
                <div class="algorithm-buttons">
                    <button class="algo-btn" data-algorithm="bubble">Bubble Sort</button>
                    <button class="algo-btn" data-algorithm="selection">Selection Sort</button>
                    <button class="algo-btn" data-algorithm="insertion">Insertion Sort</button>
                    <button class="algo-btn" data-algorithm="merge">Merge Sort</button>
                    <button class="algo-btn" data-algorithm="quick">Quick Sort</button>
                    <button class="algo-btn" data-algorithm="heap">Heap Sort</button>
                </div>
            </div>

            <div class="visualizer-container">
                <div id="array_container" class="array-display"></div>
                
                <div class="complexity-panel">
                    <div class="complexity-card">
                        <h3><i class="fas fa-clock"></i> Time Complexity</h3>
                        <div class="complexity-details">
                            <div class="complexity-row">
                                <span class="label">Best Case:</span>
                                <span id="Time_Best" class="value">-</span>
                            </div>
                            <div class="complexity-row">
                                <span class="label">Average Case:</span>
                                <span id="Time_Average" class="value">-</span>
                            </div>
                            <div class="complexity-row">
                                <span class="label">Worst Case:</span>
                                <span id="Time_Worst" class="value">-</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="complexity-card">
                        <h3><i class="fas fa-memory"></i> Space Complexity</h3>
                        <div class="complexity-details">
                            <div class="complexity-row">
                                <span class="label">Worst Case:</span>
                                <span id="Space_Worst" class="value">-</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Created by Archit Srivastava</p>
            <div class="social-links">
                <a href="https://archit-srivastava.netlify.app/" title="Portfolio" target="_blank"><i class="fa-solid fa-circle-user"></i></i></a>
                <a href="https://www.linkedin.com/in/archit008/" title="LinkedIn" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="scripts/main.js"></script>
    <script src="scripts/visualizations.js"></script>
    <script src="scripts/bubble_sort.js"></script>
    <script src="scripts/selection_sort.js"></script>
    <script src="scripts/insertion_sort.js"></script>
    <script src="scripts/merge_sort.js"></script>
    <script src="scripts/quick_sort.js"></script>
    <script src="scripts/heap_sort.js"></script>
</body>
</html>
